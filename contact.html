<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact | Maestro Paints</title><link rel="stylesheet" href="style.css"></head>
<body data-page="contact"><div id="site-header"></div>
<main class="contact-page">
<div class="container contact-layout">
  <div>
    <p class="eyebrow">Contact Us</p>
    <h1 class="display contact-title">We're Here To Help.</h1>
    <p class="contact-intro">Get in touch with our team for product advice, quotations or any other enquiries.</p>
    <div class="contact-cards">
      <a class="contact-card" href="tel:+27849091786"><img src="assets/icons/phone.svg"><div><strong>Call Us</strong><span>084 909 1786</span></div></a>
      <a class="contact-card whatsapp-card whatsapp-link" target="_blank" rel="noopener"><img src="assets/icons/whatsapp.svg"><div><strong>WhatsApp</strong><span>084 909 1786</span></div></a>
      <a class="contact-card" href="mailto:info@maestropaints.co.za"><img src="assets/icons/email.svg"><div><strong>Email Us</strong><span>info@maestropaints.co.za</span></div></a>
      <div class="contact-card"><img src="assets/icons/location.svg"><div><strong>Visit Us</strong><span>9 Maplefield Place,<br>Umgeni Business Park,<br>Durban</span></div></div>
    </div>
  </div>
  <form id="contactForm" class="form-card">
    <h3>Send Us A Message</h3>
    <input required name="name" placeholder="Your Name">
    <input required name="email" type="email" placeholder="Email Address">
    <input name="phone" placeholder="Phone Number">
    <textarea required name="message" placeholder="How can we help?"></textarea>
    <button class="btn btn-red" type="submit">Send Message</button>
  </form>
</div>
</main>
<div id="site-footer"></div>
<a class="whatsapp-float whatsapp-link" target="_blank" rel="noopener"><img src="assets/icons/whatsapp.svg"><span>Chat on WhatsApp</span></a>
<script src="main.js"></script></body></html>
